<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090a0f">
  <title>V-Remote Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #090a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }

    /* Auth Screen */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: #0d0f12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }

    .auth-box {
      width: 100%;
      max-width: 340px;
      background: #161b26;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .auth-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .pin-input {
      width: 100%;
      background: #0b0e14;
      border: 1px solid #334155;
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      letter-spacing: 6px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .pin-input:focus {
      border-color: #3b82f6;
    }

    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }

    .auth-error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* Main App Layout */
    #app-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #090a0f;
    }

    /* Floating Header */
    header {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      height: 38px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 100;
      transition: opacity 0.3s, transform 0.3s;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .icon-btn:active, .icon-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
    }

    /* Desktop Viewport Canvas */
    #viewport-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
    }

    #desktop-frame {
      position: relative;
      max-width: calc(100% - 12px);
      max-height: calc(100% - 12px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: crosshair;
    }

    #stream-canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    /* On-Screen Virtual Buttons Layer */
    #buttons-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 80;
    }

    .virtual-btn {
      position: absolute;
      pointer-events: auto;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      user-select: none;
      transform: translate(-50%, -50%);
      touch-action: none;
    }

    .virtual-btn:active, .virtual-btn.active-press {
      background: rgba(37, 99, 235, 0.85);
      border-color: #60a5fa;
      transform: translate(-50%, -50%) scale(0.96);
    }

    /* Edit Mode Styling */
    .edit-mode .virtual-btn {
      border: 2px dashed #3b82f6 !important;
      background: rgba(30, 41, 59, 0.85) !important;
      cursor: move;
    }
    .edit-mode .virtual-btn.selected {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.3) !important;
    }

    .btn-delete-tag {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .edit-mode .selected .btn-delete-tag {
      display: flex;
    }

    /* Edit Toolbar */
    #edit-toolbar {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 38, 0.95);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 6px 12px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 110;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }

    /* Floating Hotkeys Drawer */
    #bottom-dock {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 96%;
      overflow-x: auto;
      z-index: 90;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .dock-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .dock-btn:active {
      background: #2563eb;
      color: #fff;
    }
    .dock-btn.primary {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #93c5fd;
    }

    /* Text Typing Dialog */
    #text-dialog, #add-button-dialog {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1500;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #161b26;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .modal-input {
      width: 100%;
      background: #0b0e14;
      border: 1px solid #334155;
      color: #fff;
      font-size: 15px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
      margin-bottom: 14px;
    }
    .modal-input:focus {
      border-color: #3b82f6;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .preset-chip {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .preset-chip.active {
      background: #2563eb;
      border-color: #60a5fa;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Hidden input for mobile keyboard */
    #hidden-keyboard-input {
      position: absolute;
      top: -100px;
      left: -100px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Hidden text input for native mobile soft keyboard -->
  <input type="text" id="hidden-keyboard-input" autocomplete="off" autocapitalize="off" spellcheck="false">

  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-title">V-Remote Desktop</div>
      <div class="auth-subtitle">Введите PIN для подключения</div>
      <input type="password" id="pin-input" class="pin-input" maxlength="8" placeholder="••••" pattern="[0-9]*" inputmode="numeric">
      <button id="btn-login" class="btn-submit">Войти</button>
      <div id="auth-error" class="auth-error">Неверный PIN</div>
    </div>
  </div>

  <!-- Main Container -->
  <div id="app-container">

    <!-- Top Header Bar -->
    <header id="main-header">
      <div class="header-status">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Подключение...</span>
        <span id="fps-meter" style="color: #60a5fa; margin-left: 4px;">0 FPS</span>
        <span id="input-indicator" style="font-size: 11px; color: #34d399; margin-left: 6px; opacity: 0; transition: opacity 0.1s; font-weight: bold;" title="Передача ввода">⚡</span>
      </div>

      <div class="header-actions">
        <button id="btn-mode-touch" class="icon-btn active" title="Режим клика">🎯 Сенсор</button>
        <button id="btn-mode-pad" class="icon-btn" title="Режим тачпада">🖱️ Тачпад</button>
        <button id="btn-toggle-editor" class="icon-btn" title="Редактор кнопок">✏️ Редактор</button>
        <button id="btn-open-keyboard" class="icon-btn" title="Клавиатура">⌨️ Клавиатура</button>
        <button id="btn-rotate" class="icon-btn" title="Повернуть / Полный экран">🔄 16:9</button>
      </div>
    </header>

    <!-- Edit Mode Floating Toolbar -->
    <div id="edit-toolbar">
      <span style="font-size: 12px; font-weight: bold; color: #60a5fa;">✏️ Редактор</span>
      <button id="btn-add-button" class="icon-btn" style="background: #2563eb; color: #fff;">+ Кнопка</button>
      <button id="btn-reset-layout" class="icon-btn">Сброс</button>
      <button id="btn-done-edit" class="icon-btn" style="background: #10b981; color: #fff;">✓ Готово</button>
    </div>

    <!-- Viewport with 16:9 Desktop Frame -->
    <div id="viewport-wrapper">
      <div id="desktop-frame">
        <canvas id="stream-canvas" width="1280" height="720"></canvas>
        <!-- Virtual Buttons Layer -->
        <div id="buttons-overlay"></div>
      </div>
    </div>

    <!-- Bottom Dock with Hotkeys -->
    <div id="bottom-dock">
      <button class="dock-btn primary" id="btn-key-win">⊞ Win</button>
      <button class="dock-btn" id="btn-key-wind">Win+D</button>
      <button class="dock-btn" id="btn-key-esc">Esc</button>
      <button class="dock-btn" id="btn-key-tab">Tab</button>
      <button class="dock-btn" id="btn-key-enter">Enter</button>
      <button class="dock-btn" id="btn-key-del">⌫ Del</button>
      <button class="dock-btn" id="btn-key-text">📝 Текст</button>
      <button class="dock-btn" id="btn-key-alttab">Alt+Tab</button>
      <button class="dock-btn" id="btn-key-ctrlz">Ctrl+Z</button>
      <button class="dock-btn" id="btn-toggle-buttons">🎮 Скрыть кнопки</button>
    </div>
  </div>

  <!-- Text Input Modal (Full Unicode, Russian/English) -->
  <div id="text-dialog">
    <div class="modal-box">
      <div class="modal-title">Отправить текст на ПК</div>
      <input type="text" id="type-text-input" class="modal-input" placeholder="Любой текст, ссылка, пароль...">
      <div class="modal-actions">
        <button id="btn-cancel-text" class="dock-btn">Отмена</button>
        <button id="btn-send-text" class="dock-btn primary" style="background: #2563eb; color: #fff;">Отправить</button>
      </div>
    </div>
  </div>

  <!-- Add Button Modal -->
  <div id="add-button-dialog">
    <div class="modal-box">
      <div class="modal-title">Добавить кнопку</div>
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Выберите клавишу:</div>
      <div class="preset-grid" id="preset-grid"></div>
      <div class="modal-actions">
        <button id="btn-cancel-add" class="dock-btn">Отмена</button>
        <button id="btn-confirm-add" class="dock-btn primary" style="background: #2563eb; color: #fff;">Добавить</button>
      </div>
    </div>
  </div>

  <script>
    // State & Config
    let token = localStorage.getItem('v_remote_token') || '7373';
    let ws = null;
    let controlMode = 'direct'; // 'direct' or 'trackpad'
    let isEditMode = false;
    let showButtons = true;
    let selectedBtnId = null;

    let frameCount = 0;
    let lastFpsUpdate = Date.now();

    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const pinInput = document.getElementById('pin-input');
    const btnLogin = document.getElementById('btn-login');
    const authError = document.getElementById('auth-error');

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const fpsMeter = document.getElementById('fps-meter');
    const canvas = document.getElementById('stream-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const desktopFrame = document.getElementById('desktop-frame');
    const buttonsOverlay = document.getElementById('buttons-overlay');
    const editToolbar = document.getElementById('edit-toolbar');

    const btnModeTouch = document.getElementById('btn-mode-touch');
    const btnModePad = document.getElementById('btn-mode-pad');
    const btnToggleEditor = document.getElementById('btn-toggle-editor');
    const btnOpenKeyboard = document.getElementById('btn-open-keyboard');
    const btnRotate = document.getElementById('btn-rotate');

    const btnAddButton = document.getElementById('btn-add-button');
    const btnResetLayout = document.getElementById('btn-reset-layout');
    const btnDoneEdit = document.getElementById('btn-done-edit');

    const hiddenKeyboardInput = document.getElementById('hidden-keyboard-input');
    const textDialog = document.getElementById('text-dialog');
    const typeTextInput = document.getElementById('type-text-input');
    const btnSendText = document.getElementById('btn-send-text');
    const btnCancelText = document.getElementById('btn-cancel-text');

    const addButtonDialog = document.getElementById('add-button-dialog');
    const presetGrid = document.getElementById('preset-grid');
    const btnConfirmAdd = document.getElementById('btn-confirm-add');
    const btnCancelAdd = document.getElementById('btn-cancel-add');
    const btnToggleButtons = document.getElementById('btn-toggle-buttons');
    const inputIndicator = document.getElementById('input-indicator');

    // Default Buttons Layout
    const DEFAULT_BUTTONS = [
      { id: 'w', label: 'W', key: 'w', isMouse: false, rx: 0.14, ry: 0.58, size: 50 },
      { id: 'a', label: 'A', key: 'a', isMouse: false, rx: 0.07, ry: 0.70, size: 50 },
      { id: 's', label: 'S', key: 's', isMouse: false, rx: 0.14, ry: 0.70, size: 50 },
      { id: 'd', label: 'D', key: 'd', isMouse: false, rx: 0.21, ry: 0.70, size: 50 },
      { id: 'shift', label: 'Shift', key: 'shift', isMouse: false, rx: 0.07, ry: 0.83, size: 50 },
      { id: 'space', label: 'Space', key: 'space', isMouse: false, rx: 0.18, ry: 0.83, size: 56 },
      { id: 'lmb', label: 'ЛКМ', key: 'left', isMouse: true, rx: 0.82, ry: 0.70, size: 56 },
      { id: 'rmb', label: 'ПКМ', key: 'right', isMouse: true, rx: 0.91, ry: 0.60, size: 52 },
      { id: 'e', label: 'E', key: 'e', isMouse: false, rx: 0.76, ry: 0.58, size: 48 },
      { id: 'f', label: 'F', key: 'f', isMouse: false, rx: 0.84, ry: 0.48, size: 48 },
      { id: 'esc', label: 'Esc', key: 'esc', isMouse: false, rx: 0.92, ry: 0.16, size: 44 }
    ];

    let customButtons = loadButtons();

    function loadButtons() {
      try {
        const saved = localStorage.getItem('v_remote_buttons_web');
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_BUTTONS));
    }

    function saveButtons() {
      localStorage.setItem('v_remote_buttons_web', JSON.stringify(customButtons));
    }

    // Vibration helper
    function vibrate(ms = 25) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    // Wake Lock
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    // Input activity indicator pulse
    let indicatorTimer = null;
    function pulseInputIndicator() {
      if (!inputIndicator) return;
      inputIndicator.style.opacity = '1';
      clearTimeout(indicatorTimer);
      indicatorTimer = setTimeout(() => {
        inputIndicator.style.opacity = '0';
      }, 100);
    }

    // WebSocket Sender
    function sendPayload(type, data = {}) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, ...data }));
        pulseInputIndicator();
      }
    }

    // Connect WebSocket
    function connectWs() {
      const loc = window.location;
      const wsProtocol = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${loc.host}/ws?token=${encodeURIComponent(token)}`;

      ws = new WebSocket(wsUrl);
      ws.binaryType = 'blob';

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = 'Подключено';
        authScreen.style.display = 'none';
        requestWakeLock();
      };

      ws.onmessage = (e) => {
        if (e.data instanceof Blob) {
          const url = URL.createObjectURL(e.data);
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);

            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate >= 1000) {
              fpsMeter.textContent = `${frameCount} FPS`;
              frameCount = 0;
              lastFpsUpdate = now;
            }
          };
          img.onerror = () => URL.revokeObjectURL(url);
          img.src = url;
          return;
        }

        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'auth_ok') {
            localStorage.setItem('v_remote_token', token);
            authScreen.style.display = 'none';
          } else if (msg.type === 'auth_error') {
            authError.textContent = msg.message || 'Ошибка авторизации';
            authError.style.display = 'block';
          }
        } catch (err) {}
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Офлайн';
        fpsMeter.textContent = '0 FPS';
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => ws.close();
    }

    // Authentication Init
    pinInput.value = token;
    btnLogin.addEventListener('click', () => {
      token = pinInput.value.trim();
      authError.style.display = 'none';
      connectWs();
    });
    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnLogin.click();
    });

    if (token) connectWs();

    // Render Virtual Buttons
    function renderButtons() {
      buttonsOverlay.innerHTML = '';
      if (!showButtons) return;

      const rect = desktopFrame.getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;

      customButtons.forEach(btn => {
        const el = document.createElement('div');
        el.className = 'virtual-btn' + (isEditMode && selectedBtnId === btn.id ? ' selected' : '');
        el.style.width = `${btn.size}px`;
        el.style.height = `${btn.size}px`;
        el.style.left = `${btn.rx * 100}%`;
        el.style.top = `${btn.ry * 100}%`;
        el.textContent = btn.label;

        // Delete tag
        const delTag = document.createElement('div');
        delTag.className = 'btn-delete-tag';
        delTag.innerHTML = '✕';
        delTag.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          customButtons = customButtons.filter(b => b.id !== btn.id);
          saveButtons();
          renderButtons();
        });
        el.appendChild(delTag);

        if (isEditMode) {
          // Dragging logic in Edit Mode
          let startX, startY, origRx, origRy;
          el.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            selectedBtnId = btn.id;
            renderButtons();
            startX = e.clientX;
            startY = e.clientY;
            origRx = btn.rx;
            origRy = btn.ry;
            el.setPointerCapture(e.pointerId);

            const onPointerMove = (me) => {
              const dx = (me.clientX - startX) / W;
              const dy = (me.clientY - startY) / H;
              btn.rx = Math.max(0.04, Math.min(0.96, origRx + dx));
              btn.ry = Math.max(0.04, Math.min(0.96, origRy + dy));
              el.style.left = `${btn.rx * 100}%`;
              el.style.top = `${btn.ry * 100}%`;
            };

            const onPointerUp = (ue) => {
              el.removeEventListener('pointermove', onPointerMove);
              el.removeEventListener('pointerup', onPointerUp);
              saveButtons();
            };

            el.addEventListener('pointermove', onPointerMove);
            el.addEventListener('pointerup', onPointerUp);
          });
        } else {
          // Game Mode Press & Hold Logic
          el.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            el.classList.add('active-press');
            vibrate(15);

            if (btn.isMouse) {
              sendPayload('mouse_button', { button: btn.key, action: 'down' });
            } else {
              sendPayload('key_down', { key: btn.key });
            }

            const onRelease = () => {
              el.classList.remove('active-press');
              if (btn.isMouse) {
                sendPayload('mouse_button', { button: btn.key, action: 'up' });
              } else {
                sendPayload('key_up', { key: btn.key });
              }
              window.removeEventListener('pointerup', onRelease);
              window.removeEventListener('pointercancel', onRelease);
            };

            window.addEventListener('pointerup', onRelease);
            window.addEventListener('pointercancel', onRelease);
          });
        }

        buttonsOverlay.appendChild(el);
      });
    }

    window.addEventListener('resize', renderButtons);

    // Edit Mode Toggle
    btnToggleEditor.addEventListener('click', () => {
      isEditMode = !isEditMode;
      document.body.classList.toggle('edit-mode', isEditMode);
      editToolbar.style.display = isEditMode ? 'flex' : 'none';
      btnToggleEditor.classList.toggle('active', isEditMode);
      renderButtons();
    });

    btnDoneEdit.addEventListener('click', () => {
      isEditMode = false;
      document.body.classList.remove('edit-mode');
      editToolbar.style.display = 'none';
      btnToggleEditor.classList.remove('active');
      saveButtons();
      renderButtons();
    });

    btnResetLayout.addEventListener('click', () => {
      customButtons = JSON.parse(JSON.stringify(DEFAULT_BUTTONS));
      saveButtons();
      renderButtons();
    });

    // Add Button Modal & Presets
    const PRESET_KEYS = [
      { label: 'W', key: 'w' }, { label: 'A', key: 'a' }, { label: 'S', key: 's' }, { label: 'D', key: 'd' },
      { label: 'Space', key: 'space' }, { label: 'Shift', key: 'shift' }, { label: 'Ctrl', key: 'ctrl' }, { label: 'Alt', key: 'alt' },
      { label: 'E', key: 'e' }, { label: 'F', key: 'f' }, { label: 'Q', key: 'q' }, { label: 'R', key: 'r' },
      { label: 'C', key: 'c' }, { label: 'Tab', key: 'tab' }, { label: 'Esc', key: 'esc' }, { label: 'Enter', key: 'enter' },
      { label: '1', key: '1' }, { label: '2', key: '2' }, { label: '3', key: '3' }, { label: '4', key: '4' },
      { label: 'ЛКМ', key: 'left', isMouse: true }, { label: 'ПКМ', key: 'right', isMouse: true }
    ];

    let selectedPreset = PRESET_KEYS[0];

    function buildPresetGrid() {
      presetGrid.innerHTML = '';
      PRESET_KEYS.forEach(p => {
        const chip = document.createElement('div');
        chip.className = 'preset-chip' + (selectedPreset === p ? ' active' : '');
        chip.textContent = p.label;
        chip.addEventListener('click', () => {
          selectedPreset = p;
          buildPresetGrid();
        });
        presetGrid.appendChild(chip);
      });
    }

    btnAddButton.addEventListener('click', () => {
      buildPresetGrid();
      addButtonDialog.style.display = 'flex';
    });

    btnCancelAdd.addEventListener('click', () => {
      addButtonDialog.style.display = 'none';
    });

    btnConfirmAdd.addEventListener('click', () => {
      const newBtn = {
        id: 'btn_' + Date.now(),
        label: selectedPreset.label,
        key: selectedPreset.key,
        isMouse: !!selectedPreset.isMouse,
        rx: 0.5,
        ry: 0.5,
        size: 52
      };
      customButtons.push(newBtn);
      saveButtons();
      addButtonDialog.style.display = 'none';
      renderButtons();
    });

    // Desktop vs Mobile Detection
    const isDesktop = !/Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (isDesktop) {
      showButtons = false;
      document.getElementById('btn-open-keyboard').style.display = 'none';
      document.getElementById('btn-mode-pad').style.display = 'none';
      document.getElementById('btn-mode-touch').style.display = 'none';
      btnToggleButtons.textContent = '🎮 Показать кнопки';
    }

    // Touch & Mouse Pointer Handling on Desktop Frame
    let isMouseDown = false;
    let lastX = 0, lastY = 0;
    let touchStartTime = 0;
    let touchStartX = 0, touchStartY = 0;
    let lastMoveTime = 0;

    desktopFrame.addEventListener('contextmenu', (e) => e.preventDefault());

    function sendThrottledMove(rx, ry) {
      const now = performance.now();
      if (now - lastMoveTime >= 15) {
        lastMoveTime = now;
        sendPayload('mouse_move_abs', { rx, ry });
      }
    }

    // Mouse Move on PC & Direct Touch Drag
    desktopFrame.addEventListener('pointermove', (e) => {
      if (isEditMode) return;
      const rect = desktopFrame.getBoundingClientRect();
      const rx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const ry = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

      if (e.pointerType === 'mouse') {
        // Track hover cursor movement on PC
        sendThrottledMove(rx, ry);
      } else if (isMouseDown && controlMode === 'direct') {
        sendThrottledMove(rx, ry);
      } else if (isMouseDown && controlMode === 'trackpad') {
        const dx = (e.clientX - lastX) * 1.5;
        const dy = (e.clientY - lastY) * 1.5;
        sendPayload('mouse_move', { dx: Math.round(dx), dy: Math.round(dy) });
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    desktopFrame.addEventListener('pointerdown', (e) => {
      if (isEditMode) return;
      isMouseDown = true;
      try { desktopFrame.setPointerCapture(e.pointerId); } catch(err) {}

      const rect = desktopFrame.getBoundingClientRect();
      const rx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const ry = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      lastX = e.clientX;
      lastY = e.clientY;
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      touchStartTime = Date.now();

      sendPayload('mouse_move_abs', { rx, ry });

      // Physical PC Mouse Buttons
      if (e.pointerType === 'mouse') {
        const btn = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
        sendPayload('mouse_button', { button: btn, action: 'down' });
      }
    });

    desktopFrame.addEventListener('pointerup', (e) => {
      if (isEditMode) return;
      isMouseDown = false;
      try { desktopFrame.releasePointerCapture(e.pointerId); } catch(err) {}

      const rect = desktopFrame.getBoundingClientRect();
      const rx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const ry = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      const duration = Date.now() - touchStartTime;
      const movedDist = Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY);

      if (e.pointerType === 'mouse') {
        const btn = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
        sendPayload('mouse_button', { button: btn, action: 'up' });
      } else if (controlMode === 'direct') {
        // Touch screen tap / long press
        if (duration < 350 && movedDist < 20) {
          vibrate(20);
          sendPayload('mouse_move_abs', { rx, ry });
          sendPayload('mouse_click', { button: 'left' });
        } else if (duration >= 600 && movedDist < 20) {
          vibrate(40);
          sendPayload('mouse_move_abs', { rx, ry });
          sendPayload('mouse_click', { button: 'right' });
        }
      } else if (controlMode === 'trackpad') {
        if (duration < 250 && movedDist < 10) {
          vibrate(20);
          sendPayload('mouse_click', { button: 'left' });
        }
      }
    });

    desktopFrame.addEventListener('pointercancel', (e) => {
      isMouseDown = false;
      try { desktopFrame.releasePointerCapture(e.pointerId); } catch(err) {}
    });

    // Mouse Wheel Scroll (PC)
    desktopFrame.addEventListener('wheel', (e) => {
      e.preventDefault();
      const deltaY = e.deltaY > 0 ? -1 : 1;
      sendPayload('mouse_scroll', { delta_y: deltaY });
    }, { passive: false });

    // Mode Buttons
    btnModeTouch.addEventListener('click', () => {
      controlMode = 'direct';
      btnModeTouch.classList.add('active');
      btnModePad.classList.remove('active');
    });

    btnModePad.addEventListener('click', () => {
      controlMode = 'trackpad';
      btnModePad.classList.add('active');
      btnModeTouch.classList.remove('active');
    });

    // Fullscreen / 16:9
    btnRotate.addEventListener('click', async () => {
      vibrate(25);
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
          }
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {}
    });

    // Mobile Virtual Soft Keyboard Input Fix
    btnOpenKeyboard.addEventListener('click', () => {
      hiddenKeyboardInput.focus();
      hiddenKeyboardInput.click();
    });

    hiddenKeyboardInput.addEventListener('input', (e) => {
      const val = hiddenKeyboardInput.value;
      if (val) {
        sendPayload('type_text', { text: val });
        hiddenKeyboardInput.value = '';
      }
    });

    hiddenKeyboardInput.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') {
        sendPayload('key_tap', { key: 'backspace' });
      } else if (e.key === 'Enter') {
        sendPayload('key_tap', { key: 'enter' });
      }
    });

    // Full Physical Keyboard Mapping for PC
    const CODE_TO_KEY = {
      'KeyW': 'w', 'KeyA': 'a', 'KeyS': 's', 'KeyD': 'd',
      'KeyQ': 'q', 'KeyE': 'e', 'KeyR': 'r', 'KeyF': 'f',
      'KeyC': 'c', 'KeyX': 'x', 'KeyZ': 'z', 'KeyV': 'v',
      'KeyB': 'b', 'KeyN': 'n', 'KeyM': 'm', 'KeyT': 't',
      'KeyY': 'y', 'KeyU': 'u', 'KeyI': 'i', 'KeyO': 'o', 'KeyP': 'p',
      'KeyG': 'g', 'KeyH': 'h', 'KeyJ': 'j', 'KeyK': 'k', 'KeyL': 'l',
      'Digit1': '1', 'Digit2': '2', 'Digit3': '3', 'Digit4': '4',
      'Digit5': '5', 'Digit6': '6', 'Digit7': '7', 'Digit8': '8', 'Digit9': '9', 'Digit0': '0',
      'Minus': '-', 'Equal': '=', 'BracketLeft': '[', 'BracketRight': ']', 'Backslash': '\\',
      'Semicolon': ';', 'Quote': '\'', 'Comma': ',', 'Period': '.', 'Slash': '/', 'Backquote': '`',
      'Space': 'space', 'ShiftLeft': 'shift', 'ShiftRight': 'shift',
      'ControlLeft': 'ctrl', 'ControlRight': 'ctrl', 'AltLeft': 'alt', 'AltRight': 'alt',
      'Tab': 'tab', 'Enter': 'enter', 'Escape': 'esc', 'Backspace': 'backspace', 'Delete': 'del',
      'ArrowUp': 'arrowup', 'ArrowDown': 'arrowdown', 'ArrowLeft': 'arrowleft', 'ArrowRight': 'arrowright',
      'MetaLeft': 'win', 'MetaRight': 'win',
      'F1': 'f1', 'F2': 'f2', 'F3': 'f3', 'F4': 'f4', 'F5': 'f5', 'F6': 'f6',
      'F7': 'f7', 'F8': 'f8', 'F9': 'f9', 'F10': 'f10', 'F11': 'f11', 'F12': 'f12'
    };

    const pressedKeys = new Set();

    window.addEventListener('keydown', (e) => {
      // Don't intercept when modal dialogs or input fields are active
      if (authScreen.style.display !== 'none' || textDialog.style.display !== 'none' || addButtonDialog.style.display !== 'none') return;
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

      const code = e.code;

      // Prevent browser default keys (Space scroll, Tab focus, Alt shortcuts, F1 help, F5 refresh)
      if (['Space', 'Tab', 'AltLeft', 'AltRight', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'F1', 'F3', 'F5', 'F6', 'F11', 'F12'].includes(code)) {
        e.preventDefault();
      }

      const targetKey = CODE_TO_KEY[code] || (e.key && e.key.length === 1 ? e.key.toLowerCase() : null);
      if (targetKey && !pressedKeys.has(code)) {
        pressedKeys.add(code);
        sendPayload('key_down', { key: targetKey });
      }
    });

    window.addEventListener('keyup', (e) => {
      if (authScreen.style.display !== 'none' || textDialog.style.display !== 'none' || addButtonDialog.style.display !== 'none') return;
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

      const code = e.code;
      pressedKeys.delete(code);

      const targetKey = CODE_TO_KEY[code] || (e.key && e.key.length === 1 ? e.key.toLowerCase() : null);
      if (targetKey) {
        sendPayload('key_up', { key: targetKey });
      }
    });

    // Release all keys when window loses focus (prevent sticky keys)
    window.addEventListener('blur', () => {
      pressedKeys.forEach(code => {
        const targetKey = CODE_TO_KEY[code];
        if (targetKey) sendPayload('key_up', { key: targetKey });
      });
      pressedKeys.clear();
    });

    // Text Sender Dialog (All Unicode languages, Cyrillic, links)
    const btnKeyText = document.getElementById('btn-key-text');
    btnKeyText.addEventListener('click', () => {
      textDialog.style.display = 'flex';
      typeTextInput.focus();
    });

    btnCancelText.addEventListener('click', () => {
      textDialog.style.display = 'none';
    });

    btnSendText.addEventListener('click', () => {
      const val = typeTextInput.value;
      if (val) {
        sendPayload('type_text', { text: val });
        typeTextInput.value = '';
      }
      textDialog.style.display = 'none';
    });

    typeTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnSendText.click();
    });

    // Hotkey Dock Listeners
    document.getElementById('btn-key-win').addEventListener('click', () => sendPayload('key_tap', { key: 'win' }));
    document.getElementById('btn-key-wind').addEventListener('click', () => sendPayload('hotkey', { keys: ['win', 'd'] }));
    document.getElementById('btn-key-esc').addEventListener('click', () => sendPayload('key_tap', { key: 'esc' }));
    document.getElementById('btn-key-tab').addEventListener('click', () => sendPayload('key_tap', { key: 'tab' }));
    document.getElementById('btn-key-enter').addEventListener('click', () => sendPayload('key_tap', { key: 'enter' }));
    document.getElementById('btn-key-del').addEventListener('click', () => sendPayload('key_tap', { key: 'backspace' }));
    document.getElementById('btn-key-alttab').addEventListener('click', () => sendPayload('hotkey', { keys: ['alt', 'tab'] }));
    document.getElementById('btn-key-ctrlz').addEventListener('click', () => sendPayload('hotkey', { keys: ['ctrl', 'z'] }));

    // Toggle button visibility
    btnToggleButtons.addEventListener('click', () => {
      showButtons = !showButtons;
      btnToggleButtons.textContent = showButtons ? '🎮 Скрыть кнопки' : '🎮 Показать кнопки';
      renderButtons();
    });

    // Initial render
    setTimeout(renderButtons, 200);
  </script>
</body>
</html>

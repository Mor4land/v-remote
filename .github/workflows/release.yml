name: Build APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk v-remote-debug.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "V-Remote ${{ github.ref_name }} (Android APK)"
          body: |
            ## V-Remote (Android Client + PC Server)
            
            ### Возможности:
            - **Material Design 3** интерфейс на Jetpack Compose
            - **Чистый UDP бинарный протокол** с ультранизкой задержкой
            - Живой видеопоток рабочего стола (2560x1440 ➔ 720p/1080p)
            - Режимы «🎯 Сенсор» (прямой клик по экрану) и «🖱️ Тачпад»
            - Выделенная системная кнопка `⊞ Win` и быстрые хоткеи
            - Встроенный замер пинга в реальном времени (`⚡ RTT ms`)
            - Защита от брутфорса и PIN-авторизация
          files: v-remote-debug.apk
